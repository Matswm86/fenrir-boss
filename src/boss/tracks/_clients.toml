# The default client pool, used by every track that does not bring its own [[clients]].
# All fiction: no real company, no real person. "hidden" facts are only revealed when the
# learner asks the right question in a scoping call. Edit freely, or copy into your own track.

[[clients]]
name = "Kvernbit Bakery"
sector = "bakery with two shops and a wholesale line to cafes"
contact = "Anne-Lise Torvund"
role = "owner"
data = "daily sales CSV per shop, wholesale orders in a spreadsheet, a product list with allergens and prices"
situation = "She spends Friday afternoons reconciling the two shops' sales exports against wholesale invoices by hand. Wants 'something that just tells me the numbers'."
hidden = [
  "Budget is 2,500 EUR for a first version, could stretch to 4,000 if it saves a full day a week.",
  "The wholesale spreadsheet has three different date formats because two staff edit it.",
  "Her accountant needs the monthly totals by the 5th; that is the real deadline.",
  "She tried a no-code tool last year and it broke when a column was renamed.",
]

[[clients]]
name = "Havblikk Seafood"
sector = "small seafood exporter, twelve staff"
contact = "Roar Skjelbred"
role = "logistics manager"
data = "shipment manifests as JSON from the freight partner, temperature logs as CSV, customer orders by email"
situation = "Shipments arrive with temperature logs nobody reads until a customer complains. He wants alerts and a weekly summary."
hidden = [
  "A single rejected pallet costs about 6,000 EUR; two last year.",
  "The freight partner's JSON changed shape twice without notice.",
  "The CEO wants 'AI' in the pitch to the bank; Roar just wants the alerts.",
  "Customer emails arrive in three languages.",
]

[[clients]]
name = "Ridgeway Hiking Club"
sector = "hiking club, nonprofit, 800 members"
contact = "Ingrid Aasheim"
role = "volunteer secretary"
data = "member list CSV, trip sign-ups from a web form as JSON, trip reports as text"
situation = "Sign-ups outnumber places and she assigns them by hand while keeping it fair. The board wants a members' question service about trips and gear."
